<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">

  <title>{% block title %} {% endblock %}</title>

  {% load static %}

  <style>

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: lightgrey;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: 100% 100%;
      color: black;
    }

    * {
      box-sizing: border-box
    }

    input{
      width: 500px;
      padding: 15px;
      margin: 5px 0 22px 0;
      display: inline-block;
      border: none;
      background: #f1f1f1;
    }

    input[type=text]:focus,
    input[type=password]:focus {
      background-color: #ddd;
      outline: none;
    }

    hr {
      border: 1px solid #f1f1f1;
      margin-bottom: 18px;
    }

    button:hover {
      opacity: 1;
    }

    .container {
      padding: 20px;
      width: 700px;
      border-style: none;
      margin-top: 40px;
      
    }
    #loginform{
      background-color: whitesmoke;
      border-style: none;
    }
    .navbar {
            background-color: black;
            height: 75px;
        }
    .navbar-brand{
      font-family: 'Times New Roman', Times, serif;
    }
    #three{
      display: block;
      padding: 1px;
      background-color: #dddddd;
      margin-right: 70px;
    }
    #two{
      margin-right: 70px;
    }
    #one{
      margin-right: 10px;
    }
    #brandname{
      font-size: 35px;
    }
    #formcontainer{
      margin-left: 55px;
      margin-bottom: 20px;
    }
    
  </style>
  {% block css %} {% endblock %}
</head>

<body>
  <nav class="navbar navbar-expand-lg g-dark navbar-dark sticky-top">

    <div class="container-fluid">
      <a class="navbar-brand" id="brandname" href="#">CruiseWise</a>
      
      
  
      <div>
        <ul class="navbar-nav">
          <li class="nav-item" id="one">
            <a class="nav-link active" id="one" aria-current="page" href="">About us</a>
          </li>
          <li class="nav-item" id="two">
            <a class="nav-link active" id="two" aria-current="page" href="/customer_login/">Sign in</a>
          </li>
          <li class="nav-item" id="three">
            <a class="nav-link active" id="three" aria-current="page" href="/customer_signup/">Sign up</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>


  <div class="container" id="loginform">
    <form style="border:5px solid #ccc" method="POST"> {% csrf_token %}
      <div class="container" id="formcontainer">
        <h1>Register your details</h1>
      <p>Please fill in this form to create an account.</p>
      <hr>
  
      <label><b>First Name</b></label><br>
      <input type="text" placeholder="Enter First Name" name="first_name" required><br>

      <label><b>Last Name</b></label><br>
      <input type="text" placeholder="Enter Last Name" name="last_name" required><br>

      <label><b>Username</b></label><br>
      <input type="text" placeholder="Enter Username" name="username" required><br>
  
      <label><b>Email</b></label><br>
      <input type="text" placeholder="Enter Email" name="email" required><br>

      <label><b>Contact Number</b></label><br>
      <input type="text" placeholder="Enter Contact Number" name="phone" required><br>

      <label><b>City</b></label><br>
      <input type="text" placeholder="Enter City" name="city" required><br>
  
      <label><b>Password</b></label><br>
      <input type="password" placeholder="Enter Password" name="password1" required><br>

      <label><b>Confirm Password</b></label><br>
      <input type="password" placeholder="Confirm Password" name="password2" required><br>
            
      <p>By creating an account you agree to our <a href="#" style="color:dodgerblue">Terms & Privacy</a>.</p><br>
  
      <button type="submit" class="btn btn-success" style="background-color: #71cc0971; font-size: 22px; width: 8rem;">Submit</button>
      <button type="cancel" class="btn" style="background-color: gray; font-size: 22px; width: 8rem; margin-left: 230px">Cancel</button>
      </div>
    </form>
  </div>
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj"
    crossorigin="anonymous"></script>

  {% block js %} {% endblock %}

  <script>
    {% if alert %}
    alert("You are now successfully registered as a customer")
    document.location = "/customer_login"
    {% endif %}
  </script>


</body>
</html>
