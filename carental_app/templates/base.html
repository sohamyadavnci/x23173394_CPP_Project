<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">

  <title>{% block title %} {% endblock %}</title>

  {% load static %}

  <style>

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-image: url('{% static "dashboard.jpg"%}');
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: 100% 100%;
      color: white;
    }

    * {
      box-sizing: border-box
    }

    input[type=text],
    input[type=password] {
      width: 100%;
      padding: 15px;
      margin: 5px 0 22px 0;
      display: inline-block;
      border: none;
      background: #f1f1f1;
    }

    input[type=text]:focus,
    input[type=password]:focus {
      background-color: #ddd;
      outline: none;
    }

    hr {
      border: 1px solid #f1f1f1;
      margin-bottom: 25px;
    }

    button:hover {
      opacity: 1;
    }

    .container {
      padding: 20px;
    }
    .navbar {
            background-color: black;
            height: 75px;
        }
    .navbar-brand{
      font-family: 'Times New Roman', Times, serif;
    }
    #three{
      display: block;
      padding: 1px;
      background-color: #dddddd;
      margin-right: 70px;
    }
    #two{
      margin-right: 70px;
    }
    #one{
      margin-right: 10px;
    }
    #brandname{
      font-size: 35px;
    }
    
  </style>
  {% block css %} {% endblock %}
</head>

<body>
  <nav class="navbar navbar-expand-lg g-dark navbar-dark sticky-top">

    <div class="container-fluid">
      <a class="navbar-brand" id="brandname" href="">CruiseWise</a>
      
      
  
      <div>
        <ul class="navbar-nav">
          <li class="nav-item" id="one">
            <a class="nav-link active" id="one" aria-current="page" href="about">About us</a>
          </li>
          <li class="nav-item" id="two">
            <a class="nav-link active" id="two" aria-current="page" href="customer_login">Sign in</a>
          </li>
          <li class="nav-item" id="three">
            <a class="nav-link active" id="three" aria-current="page" href="customer_signup">Sign up</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  

  {% block body %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj"
    crossorigin="anonymous"></script>

  {% block js %} {% endblock %}

</body>
</html>
